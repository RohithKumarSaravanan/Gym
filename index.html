<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fit4Less Routine</title>
<style>
:root{--bg:#0b0f17;--card:#141a24;--card2:#1b2330;--bd:#263042;--tx:#f2f4f8;--sub:#98a2b3;--y:#f59e0b;--g:#22c55e;--b:#38bdf8;--r:16px;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:radial-gradient(900px 400px at 50% -100px,#1a2540 0,transparent 70%),var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:680px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(110px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid var(--y);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 10px}
h1{font-size:1.15rem;font-weight:800;letter-spacing:-.3px}
h1 span{color:var(--y)}
.sub{font-size:.74rem;color:var(--sub)}
.streak{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;text-align:center;font-size:.72rem;color:var(--sub);white-space:nowrap}
.streak b{display:block;font-size:1.05rem;color:var(--y)}
.week{display:flex;gap:6px;justify-content:space-between;margin:2px 0 10px}
.dot{flex:1;text-align:center;font-size:.65rem;color:var(--sub)}
.dot i{display:block;width:22px;height:22px;margin:0 auto 3px;border-radius:50%;border:2px solid var(--bd);font-style:normal;line-height:18px;font-size:.7rem;color:#000}
.dot.on i{background:var(--g);border-color:var(--g)}
.dot.eve i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--b)}
.dot.today{color:var(--tx);font-weight:700}
.dot.today i:not(.x){border-color:var(--y)}
.walk{display:flex;align-items:center;gap:8px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.25);color:var(--b);border-radius:12px;padding:8px 12px;font-size:.78rem;font-weight:600;margin-bottom:10px}
.tabs-w{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;margin:0 -14px 12px;padding:6px 14px;background:linear-gradient(var(--bg) 85%,transparent)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:64px;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--bd);text-align:center;position:relative;transition:.15s}
.tab b{display:block;font-size:.88rem}
.tab small{font-size:.66rem;color:var(--sub)}
.tab.on{background:var(--y);border-color:var(--y);color:#000}
.tab.on small{color:#000a}
.tab.eve{border-color:var(--b)}
.tab.eve.on{background:var(--b);border-color:var(--b)}
.tab.full::after{content:"✓";position:absolute;top:-6px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--g);color:#000;font-size:.68rem;font-weight:800;line-height:18px}
.tab:active{transform:scale(.96)}
.dayc{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px}
.ring{--p:0;flex:0 0 66px;height:66px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center;transition:.3s}
.ring div{width:52px;height:52px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.8rem;font-weight:800;text-align:center;line-height:1.1}
.ring small{display:block;font-size:.58rem;color:var(--sub);font-weight:600}
.dayc h2{font-size:1.05rem;line-height:1.2}
.dayc p{font-size:.78rem;color:var(--sub);margin-top:3px}
.pills{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--card2);border-radius:7px;padding:3px 8px;font-size:.7rem;font-weight:700;color:var(--y)}
.lnk{margin-left:auto;font-size:.7rem;color:var(--sub);text-decoration:underline}
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;transition:.25s;animation:in .3s both}
.card.done{border-color:rgba(34,197,94,.5)}
.card.done .body{opacity:.6}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.media{position:relative;height:210px;background:#fff;display:grid;place-items:center;overflow:hidden}
.media::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,#eef0f3 30%,#fafbfc 50%,#eef0f3 70%) 0 0/200% 100%;animation:sh 1.2s infinite linear}
.media.ok::before,.media.err::before{display:none}
@keyframes sh{to{background-position:-200% 0}}
.media img{position:relative;width:100%;height:100%;object-fit:contain;padding:8px;opacity:0;transition:opacity .3s}
.media.ok img{opacity:1}
.media.err img{display:none}
.media.err::after{content:"🏋️";font-size:3rem}
.num{position:absolute;top:10px;left:10px;z-index:2;width:28px;height:28px;border-radius:50%;background:#0b0f17e6;color:var(--y);font-weight:800;font-size:.82rem;display:grid;place-items:center}
.body{padding:12px 14px 14px}
.ttl{font-size:1.02rem;font-weight:700;line-height:1.25}
.tag{display:inline-block;margin-top:6px;background:rgba(245,158,11,.12);color:var(--y);font-size:.72rem;padding:3px 8px;border-radius:7px;font-weight:600}
.meta{margin-top:8px;font-size:.84rem;font-weight:800;color:var(--g)}
.cue{margin-top:6px;font-size:.8rem;color:var(--sub)}
.cue b{color:var(--tx)}
.how{display:inline-block;margin-top:6px;font-size:.74rem;color:var(--b)}
.sets{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.set{flex:1;min-width:64px;padding:12px 4px;border-radius:12px;background:var(--card2);border:1px solid var(--bd);color:var(--sub);font-weight:700;font-size:.82rem;transition:.12s}
.set:active{transform:scale(.94)}
.set.on{background:var(--g);border-color:var(--g);color:#000}
.rest{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 28px);max-width:440px;z-index:100;background:#171f2cf2;backdrop-filter:blur(10px);border:1.5px solid var(--y);border-radius:34px;padding:8px 10px 8px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 10px 30px #000a;overflow:hidden}
.rest.run{border-color:var(--g)}
.rest.end{animation:pulse .6s 3}
@keyframes pulse{50%{background:#14532d}}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--g);width:0}
#td{font-weight:800;font-size:.95rem;color:var(--y);font-variant-numeric:tabular-nums;white-space:nowrap}
.rest.run #td{color:var(--g)}
.tb{display:flex;gap:6px}
.tb button{background:var(--card2);border:1px solid var(--bd);border-radius:20px;padding:8px 12px;font-size:.76rem;font-weight:700}
.tb .x{background:#dc2626;border-color:#dc2626}
.tb button:active{transform:scale(.92)}
.ov{position:fixed;inset:0;z-index:300;background:#000d;backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:.25s}
.ov.show{opacity:1;pointer-events:auto}
.modal{background:#141b26;border:2px solid var(--g);border-radius:22px;padding:24px 20px;max-width:380px;width:100%;text-align:center;transform:scale(.9);transition:.3s cubic-bezier(.2,1.4,.4,1)}
.ov.show .modal{transform:none}
.modal .ic{font-size:3rem}
.modal h3{font-size:1.35rem;margin:4px 0}
.modal p{color:var(--sub);font-size:.88rem;margin:8px 0 14px}
.wb{background:rgba(56,189,248,.1);border:1px dashed var(--b);border-radius:12px;padding:10px 12px;margin-bottom:16px;font-size:.82rem;color:var(--b);text-align:left}
.go{width:100%;background:var(--y);color:#000;border-radius:12px;padding:13px;font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div><h1>FIT4LESS <span>ROUTINE</span></h1><div class="sub">Machine routine &amp; evening posture reset</div></div>
  <div class="streak"><b id="streak">0</b>day streak</div>
</header>
<div class="week" id="week"></div>

<main class="list" id="list"></main>

  <div class="bar" id="bar"></div>
</div>

<div class="ov" id="ov"><div class="modal">
  <div class="ic">🏆</div><h3>Workout complete!</h3>

</div></div>

// [name, equipment, setsLabel, totalSets, formCue, imagePath]
const D={

};
const FALLBACK="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=600&auto=format&fit=crop&q=60";
const KEYS=Object.keys(D), $=id=>document.getElementById(id);
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},d:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const now=new Date(), mon=addDays(now,-((now.getDay()+6)%7)), WK=ymd(mon), TODAY=ymd(now);
const sk=(day,i,n)=>`fit_${WK}_${day}_${i}_${n}`; // sets reset automatically every week
const stats=day=>{let t=0,d=0;D[day].ex.forEach((e,i)=>{for(let n=1;n<=e[3];n++){t++;if(ls.g(sk(day,i,n))==="1")d++}});return{t,d}};
let cur=KEYS[(now.getDay()+6)%7];

function renderWeek(){
  let h="";["M","T","W","T","F","S","S"].forEach((l,i)=>{
    const k=ymd(addDays(mon,i)), on=ls.g("fit_done_"+k)==="1", ev=ls.g("fit_eve_"+k)==="1";
    h+=`<div class="dot ${on?"on":""} ${ev?"eve":""} ${k===TODAY?"today":""}"><i class="${on?"x":""}">${on?"✓":""}</i>${l}</div>`});
  $("week").innerHTML=h;
  let n=0,d=now; if(ls.g("fit_done_"+ymd(d))!=="1")d=addDays(d,-1);
  while(n<400&&ls.g("fit_done_"+ymd(d))==="1"){n++;d=addDays(d,-1)}
  $("streak").textContent=n;
}
function renderTabs(){
  $("tabs").innerHTML=KEYS.map(k=>{const s=stats(k);
    return `<button class="tab ${k==="eve"?"eve":""} ${k===cur?"on":""} ${s.d===s.t?"full":""}" data-k="${k}" role="tab"><b>${D[k].tab}</b><small>${D[k].focus}</small></button>`}).join("");
}
function renderInfo(){
  const c=D[cur], s=stats(cur), p=Math.round(s.d/s.t*100);
  $("info").innerHTML=`<div class="ring" style="--p:${p}"><div><span>${s.d}/${s.t}<small>sets</small></span></div></div>
  <div style="flex:1;min-width:0"><h2>${c.title}</h2><p>${c.desc}</p>
  <div class="pills"><span class="pill">📋 ${c.ex.length} exercises</span><span class="pill">⏱️ ${c.time}</span><button class="lnk" id="reset">Reset checks</button></div></div>`;
  let armed=false,tm;
  $("reset").onclick=()=>{
    const btn=$("reset");
    if(!armed){armed=true;btn.textContent="Tap again to confirm";btn.style.color="#f87171";tm=setTimeout(()=>{armed=false;btn.textContent="Reset checks";btn.style.color=""},3000);return}
    clearTimeout(tm);
    c.ex.forEach((e,i)=>{for(let n=1;n<=e[3];n++)ls.d(sk(cur,i,n))});
    ls.d((cur==="eve"?"fit_eve_":"fit_done_")+TODAY);
    render();
  };
}
function render(){
  renderTabs();renderInfo();renderWeek();
  $("list").innerHTML=D[cur].ex.map((e,i)=>{
    let b="",all=true;
    for(let n=1;n<=e[3];n++){const on=ls.g(sk(cur,i,n))==="1";if(!on)all=false;
      b+=`<button class="set ${on?"on":""}" data-i="${i}" data-n="${n}" aria-pressed="${on}">${e[3]===1?"Completed":"Set "+n}${on?" ✓":""}</button>`}
    return `<article class="card ${all?"done":""}" style="animation-delay:${Math.min(i,6)*45}ms" id="c${i}">
    <div class="media"><span class="num">${i+1}</span><img src="${B+e[5]}" alt="${e[0]} demonstration" referrerpolicy="no-referrer" ${i>1?'loading="lazy"':""}></div>
    <div class="body"><div class="ttl">${e[0]}</div><span class="tag">📍 ${e[1]}</span><div class="meta">${e[2]}</div>
    <p class="cue">💡 <b>Form:</b> ${e[4]}</p>
    <a class="how" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[0]+" proper form")}" target="_blank" rel="noopener">▶ Watch video guide</a>
    <div class="sets">${b}</div></div></article>`}).join("");
  document.querySelectorAll(".media img").forEach(im=>{
    const m=im.parentNode;
    im.addEventListener("load",()=>m.classList.add("ok"));
    im.addEventListener("error",()=>{
      if(!im.dataset.fb){im.dataset.fb=1;im.src=FALLBACK}else m.classList.add("err");
    });
    if(im.complete&&im.naturalWidth)m.classList.add("ok");
  });
}
$("tabs").onclick=e=>{const t=e.target.closest(".tab");if(!t)return;cur=t.dataset.k;render();t.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});scrollTo({top:0,behavior:"smooth"})};
$("list").onclick=e=>{
  const b=e.target.closest(".set");if(!b)return;
  const i=+b.dataset.i,n=+b.dataset.n,k=sk(cur,i,n),on=ls.g(k)!=="1";
  on?ls.s(k,"1"):ls.d(k);
  b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);
  b.textContent=(D[cur].ex[i][3]===1?"Completed":"Set "+n)+(on?" ✓":"");
  const card=$("c"+i);card.classList.toggle("done",!!card&&[...card.querySelectorAll(".set")].every(x=>x.classList.contains("on")));
  renderTabs();renderInfo();
  if(navigator.vibrate)navigator.vibrate(15);
  if(on&&D[cur].ex[i][3]>1)startTimer(90);
  const s=stats(cur);
  if(on&&s.d===s.t){
    ls.s((cur==="eve"?"fit_eve_":"fit_done_")+TODAY,"1");renderWeek();
    $("mdesc").innerHTML=`You finished every set for <b>${D[cur].title}</b>!`;
    $("mwalk").style.display=cur==="eve"?"none":"";
    $("ov").classList.add("show");
    if(navigator.vibrate)navigator.vibrate([200,100,200,100,400]);
  }
};
$("mclose").onclick=()=>$("ov").classList.remove("show");
$("ov").onclick=e=>{if(e.target===$("ov"))$("ov").classList.remove("show")};

// Rest timer (uses real timestamps so it stays accurate if the screen sleeps)
let tInt,tEnd=0,tTotal=0;
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.35)}catch(e){}}
function tick(){
  const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000)),r=$("rest");
  $("td").textContent=`Rest: ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  $("bar").style.width=(100-left/tTotal*100)+"%";
  if(left<=0){clearInterval(tInt);r.classList.remove("run");r.classList.add("end");$("td").textContent="Rest over! 🔥";beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);setTimeout(()=>r.classList.remove("end"),2000)}
}
function startTimer(s){clearInterval(tInt);tTotal=s;tEnd=Date.now()+s*1000;$("rest").classList.remove("end");$("rest").classList.add("run");tick();tInt=setInterval(tick,250)}
function stopTimer(){clearInterval(tInt);$("rest").classList.remove("run","end");$("td").textContent="Rest: Ready";$("bar").style.width=0}
document.querySelector(".tb").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.t)startTimer(+b.dataset.t);
  else if(b.dataset.add&&$("rest").classList.contains("run")){tEnd+=15000;tTotal+=15}
  else if(b.id==="stop")stopTimer();
};
render();
setTimeout(()=>{const t=document.querySelector(".tab.on");if(t)t.scrollIntoView({inline:"center",block:"nearest"})},50);
</script>
